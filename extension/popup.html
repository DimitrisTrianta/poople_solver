<!doctype html>
<html>
    <head>
        <style>
            :root {
                --bg-color: #202020;
                --text-color: #ffffff;
                --btn-bg: #2a2a2a; /* Closer to the #202020 background */
                --btn-hover: #333333;
                --border-color: #3a3a3c;
            }

            body {
                width: 260px; /* Slightly wider to fit side-by-side buttons */
                padding: 15px;
                margin: 0;
                background-color: var(--bg-color);
                color: var(--text-color);
                font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
                text-align: center;
            }

            .header {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                border-bottom: 1px solid var(--border-color);
                padding-bottom: 10px;
                margin-bottom: 20px;
            }

            h2 {
                margin: 0;
                font-size: 20px;
                font-weight: 700;
                letter-spacing: 1px;
                text-transform: uppercase;
            }

            .poop-icon {
                height: 24px;
                width: auto;
            }

            .button-row {
                display: flex;
                gap: 10px;
                justify-content: space-between;
            }

            button {
                flex: 1; /* Makes buttons share the row equally */
                padding: 12px 5px;
                cursor: pointer;
                font-size: 14px;
                font-weight: bold;
                text-transform: uppercase;
                color: white;
                background-color: var(--btn-bg);
                border: none;
                border-radius: 4px;
                transition: background-color 0.2s ease;
            }

            button:hover {
                background-color: var(--btn-hover);
            }
        </style>
    </head>

    </body>
</html>
